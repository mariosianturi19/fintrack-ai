ily="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">Data cache masih tersedia.</text><text x="1160" y="364" fill="#0B1220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">Perubahan disinkronkan nanti.</text><rect x="1108" y="422" width="296" height="66" rx="10" fill="#FCFBF7" stroke="#E7E3DA" stroke-width="1" opacity="1"/><text x="1124" y="449" fill="#0B1220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">PLN</text><text x="1388" y="449" fill="#A63D2A" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">−Rp350.000</text><text x="1124" y="469" fill="#53606C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Data tersimpan · 08 Jul</text><text x="1108" y="682" fill="#53606C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Konten tidak diganti layar error kosong.</text><rect x="280" y="772" width="1124" height="142" rx="14" fill="#FCFBF7" stroke="#D9D6CC" stroke-width="1" opacity="1"/><text x="312" y="810" fill="#0B1220" font-family="Space Grotesk, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Aturan bersama</text><text x="312" y="842" fill="#53606C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">• Layout anchor tidak berpindah drastis ketika data selesai dimuat.</text><text x="312" y="866" fill="#53606C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">• Status selalu memiliki label dan penjelasan, bukan warna saja.</text><text x="312" y="890" fill="#53606C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">• Aksi berikutnya tetap spesifik terhadap kondisi pengguna.</text>
